# We have a conf and classes directory, add to BBPATH
BBPATH := "${BBPATH}:${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES := "${BBFILES} ${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hilscher-netfield-intel"
BBFILE_PATTERN_hilscher-netfield-intel := "^${LAYERDIR}/"
BBFILE_PRIORITY_hilscher-netfield-intel = "100"

NETFIELD_INTEL_BASE = '${@os.path.normpath("${LAYERDIR}/")}'

LAYERSERIES_COMPAT_hilscher-netfield-intel = "dunfell"
LAYERDEPENDS_hilscher-netfield-intel = " \
	core yocto hilscher-netfield hilscher-netfield-oem intel gplv2 security tpm-layer \
	openembedded-layer filesystems-layer multimedia-layer networking-layer perl-layer meta-python \
	webserver swupdate \
"

KEYS_DIR := "${LAYERDIR}/keys"

BSP_DEPLOYSCRIPT_DIR = "${LAYERDIR}/scripts/deploy"
