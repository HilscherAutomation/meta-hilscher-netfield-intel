# Virtual Machine (VMWare / KVM)
SERIAL_CONSOLES = ""

MACHINE_FEATURES:append = " tpm tpm2"

require include/intel-common.inc

PRECONFIGURED_SYSTEM_CONNECTIONS ?= "eth0"

IMAGE_CLASSES:append = " image_types_ova image_types_vhdx"
OVA_DISKIMAGE_SIZE = "16G"
NETFIELD_IMAGES = ""

IMAGE_PART_BOOT_SIZE = "64M"
PART_DATA_LV_DATA_SIZE = "100%FREE"
# Make sure backup partition has enough space for updates
PART_DATA_LV_BACKUP_SIZE = "640M"

# UPNP announcement data, as there will be no devicelabel
EMULATED_MANUFACTURER:pn-upnpd-conf     = "Hilscher Gesellschaft fuer Systemautomation mbH"
EMULATED_MANUFACTURER_URL:pn-upnpd-conf = "https://www.hilscher.com"
EMULATED_PRODUCT_NAME:pn-upnpd-conf     = "NFO-DC-OTP"
EMULATED_MODEL_NAME:pn-upnpd-conf       = "netFIELD OS Datacenter"
EMULATED_MODEL_NUMBER:pn-upnpd-conf     = "NFO-DC-OTP"
EMULATED_MODEL_URL:pn-upnpd-conf        = "https://www.hilscher.com"
